# /etc/systemd/system/limelight_canbusprocess.service.d/10-diy-can.conf
# Replace the stock CAN bring-up command (which fails on MCP2515 -- see
# diy-can-setup.sh header) but keep the unit itself, because
# limelight_canbuswatchdog.service (beta14+) has After=/Wants= on it.
[Service]
ExecStart=
ExecStart=/usr/local/sbin/diy-can-setup.sh
